services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: almacenamiento_db
      POSTGRES_USER: almacenamiento_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in deployment/.env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U almacenamiento_app -d almacenamiento_db']
      interval: 5s
      retries: 20
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: almacenamiento_db
      DB_USER: almacenamiento_app
      DB_PASSWORD: ${DB_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ENV: ${APP_ENV:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - catalog_images:/app/backend/var/uploads
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  catalog_images:
